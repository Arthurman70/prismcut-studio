name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/prismcut.spec --noconfirm

      # --- code signing: PrismCut.exe --------------------------------------
      # Free OSS Authenticode signing via SignPath Foundation
      # (https://signpath.org) - gated on SIGNPATH_ORGANIZATION_ID being
      # configured so this is a no-op until the project's application is
      # approved and repo Settings -> Secrets and variables -> Actions has
      # SIGNPATH_API_TOKEN (secret) plus SIGNPATH_ORGANIZATION_ID /
      # SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG (variables)
      # filled in with the values SignPath issues on approval.
      - name: Upload unsigned exe for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: PrismCut-unsigned-exe
          path: dist/PrismCut/PrismCut.exe
          retention-days: 1

      - name: Sign PrismCut.exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/exe'

      - name: Replace exe with signed copy
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item -Path "signed\exe\PrismCut.exe" -Destination "dist\PrismCut\PrismCut.exe" -Force

      - name: Zip build
        run: Compress-Archive -Path dist/PrismCut -DestinationPath PrismCut-windows-x64.zip

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismCut-windows-x64
          path: PrismCut-windows-x64.zip

      - name: Determine installer version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss

      # --- code signing: installer ------------------------------------------
      # Same SignPath signing, applied to the installer exe itself (the file
      # most users actually download and run) - see the comment above the
      # PrismCut.exe signing steps for setup details.
      - name: Upload unsigned installer for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: PrismCut-Setup-unsigned
          path: dist/installer/*.exe
          retention-days: 1

      - name: Sign installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/installer'

      - name: Replace installer with signed copy
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Get-ChildItem "signed\installer\*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\installer\" -Force
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismCut-Studio-Setup
          path: dist/installer/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PrismCut-windows-x64.zip
            dist/installer/*.exe
